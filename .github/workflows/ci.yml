name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  contract-tests:
    name: Rust Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@1.79.0
        with:
          targets: wasm32-unknown-unknown

      - name: Verify Toolchain
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Run Cargo Test
        working-directory: contracts/aegisfund
        run: cargo test --verbose

      - name: Build Soroban Contract WASM
        working-directory: contracts/aegisfund
        run: cargo build --target wasm32-unknown-unknown --release

  frontend-checks:
    name: React Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Linter
        working-directory: frontend
        run: npm run lint || true

      - name: Build Production Frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy Smart Contract and Frontend
    needs: [contract-tests, frontend-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Make Deploy Script Executable
        run: chmod +x deploy.sh

      - name: Run Deploy Script
        run: ./deploy.sh
